<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Taets Family Travels</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Merriweather', Georgia, serif;
      background: #f5f0e8;
      color: #3a2e1e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #c8392b 0%, #922b21 100%);
      color: #fff;
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0,0,0,.3);
    }

    header h1 { font-family: 'Caveat', cursive; font-size: 1.8rem; }
    header a { color: #ffc; font-size: .85rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    .container { max-width: 820px; margin: 36px auto; padding: 0 20px 60px; }

    /* ── LOGIN ──────────────────────────────────── */
    #login-screen {
      background: #fff;
      border: 2px solid #c8392b;
      border-radius: 8px;
      padding: 40px;
      max-width: 400px;
      margin: 80px auto;
      text-align: center;
      box-shadow: 0 4px 20px rgba(200,57,43,.15);
    }

    #login-screen h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #c8392b;
      margin-bottom: 20px;
    }

    /* ── FORMS / INPUTS ─────────────────────────── */
    label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 4px;
      color: #5a4530;
    }

    input[type="text"],
    input[type="date"],
    input[type="password"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #c8b89a;
      border-radius: 5px;
      font-family: 'Merriweather', serif;
      font-size: .9rem;
      background: #fffdf8;
      color: #3a2e1e;
      margin-bottom: 14px;
      transition: border-color .15s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #c8392b;
      background: #fff;
    }

    textarea { min-height: 90px; resize: vertical; }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      border: none;
      border-radius: 5px;
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }

    .btn:active { transform: scale(.97); }

    .btn-primary { background: #c8392b; color: #fff; }
    .btn-primary:hover { background: #a93226; }
    .btn-secondary { background: #d4c5a0; color: #3a2e1e; }
    .btn-secondary:hover { background: #c8b38a; }
    .btn-danger { background: #e74c3c; color: #fff; font-size: .85rem; padding: 5px 12px; }
    .btn-danger:hover { background: #c0392b; }

    /* ── ADD POSTCARD CARD ──────────────────────── */
    .card {
      background: #fff;
      border-radius: 8px;
      border: 1.5px solid #d4c5a0;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .card h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #c8392b;
      margin-bottom: 20px;
      border-bottom: 2px dashed #e0d0b5;
      padding-bottom: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 20px;
    }

    .geocode-row {
      display: flex; gap: 10px; align-items: flex-start;
    }

    .geocode-row input { flex: 1; }

    .coord-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 20px;
    }

    /* ── LOCATION LIST ──────────────────────────── */
    .location-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px dashed #d4c5a0;
    }

    .location-item:last-child { border-bottom: none; }

    .loc-info { flex: 1; }
    .loc-name { font-weight: 700; color: #922b21; margin-bottom: 3px; }
    .loc-meta { font-size: .78rem; color: #888; font-style: italic; }
    .loc-msg { font-family: 'Caveat', cursive; font-size: .95rem; color: #555; margin-top: 4px; }

    /* ── STATUS TOAST ───────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 22px;
      border-radius: 6px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      color: #fff;
      opacity: 0;
      transition: opacity .3s;
      z-index: 9999;
      pointer-events: none;
    }

    #toast.show { opacity: 1; }
    #toast.success { background: #27ae60; }
    #toast.error { background: #c0392b; }
  </style>
</head>
<body>

<header>
  <h1>✉️ Taets Family — Admin</h1>
  <div>
    <span id="whoami" style="font-size:.85rem;margin-right:14px"></span>
    <a href="#" id="logout-link" style="display:none;margin-right:14px" onclick="logout();return false;">Sign out</a>
    <a href="/">← View Public Map</a>
  </div>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <h2>🔐 Admin Login</h2>
  <label for="login-user">Username</label>
  <input type="text" id="login-user" placeholder="Username" autocomplete="username"/>
  <label for="admin-key">Password</label>
  <input type="password" id="admin-key" placeholder="Password" autocomplete="current-password"/>
  <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
</div>

<!-- ADMIN PANEL (hidden until login) -->
<div class="container" id="admin-panel" style="display:none">

  <!-- ADD POSTCARD FORM -->
  <div class="card">
    <h2>📮 Add a New Postcard</h2>

    <label>Location Name *</label>
    <input type="text" id="f-name" placeholder="e.g. Paris, Eiffel Tower, Lake Louise"/>

    <label>Country</label>
    <input type="text" id="f-country" placeholder="e.g. France"/>

    <label>Date of Visit *</label>
    <input type="date" id="f-date"/>

    <label>Postcard Message</label>
    <textarea id="f-msg" placeholder="What did the family write on the postcard?"></textarea>

    <!-- Geocode helper -->
    <label>Find Coordinates (type location + click Search)</label>
    <div class="geocode-row">
      <input type="text" id="f-geocode" placeholder="e.g. Paris, France" style="margin-bottom:0"/>
      <button class="btn btn-secondary" onclick="geocode()">🔍 Search</button>
    </div>
    <div id="geocode-result" style="font-size:.78rem;color:#888;margin-bottom:14px;min-height:18px;"></div>

    <div class="coord-row">
      <div>
        <label>Latitude *</label>
        <input type="number" id="f-lat" step="0.0001" placeholder="e.g. 48.8566"/>
      </div>
      <div>
        <label>Longitude *</label>
        <input type="number" id="f-lng" step="0.0001" placeholder="e.g. 2.3522"/>
      </div>
    </div>

    <button class="btn btn-primary" onclick="addLocation()">📌 Add to Map</button>
  </div>

  <!-- EXISTING LOCATIONS -->
  <div class="card">
    <h2>🗺️ All Locations</h2>
    <div id="location-list"><em style="color:#999">Loading…</em></div>
  </div>

  <!-- USER MANAGEMENT (admin only) -->
  <div class="card" id="users-card" style="display:none">
    <h2>👥 Users</h2>
    <div id="user-list"></div>
    <h3 style="font-family:'Caveat',cursive;color:#922b21;margin:18px 0 10px">Add or update a user</h3>
    <div class="form-row">
      <div>
        <label>Username</label>
        <input type="text" id="u-name" placeholder="3-32 letters, numbers, . _ -" autocomplete="off"/>
      </div>
      <div>
        <label>Password (blank = keep existing)</label>
        <input type="password" id="u-pass" placeholder="At least 8 characters" autocomplete="new-password"/>
      </div>
    </div>
    <label>Role</label>
    <select id="u-role" style="width:100%;padding:9px 12px;margin-bottom:14px;border:1.5px solid #c8b89a;border-radius:5px">
      <option value="edit">Edit — can add postcards</option>
      <option value="admin">Admin — can also delete postcards and manage users</option>
    </select>
    <button class="btn btn-primary" onclick="saveUser()">💾 Save User</button>
  </div>

</div>

<div id="toast"></div>

<script>
  let token = '';
  let me = null; // { username, role }

  const authHeaders = (extra = {}) => ({ ...extra, 'x-auth-token': 'Bearer ' + token });

  // ── LOGIN ──────────────────────────────────────
  async function login() {
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('admin-key').value;
    if (!username || !password) return toast('Enter your username and password', 'error');
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!r.ok) return toast('Invalid username or password', 'error');
      const data = await r.json();
      token = data.token;
      me = { username: data.username, role: data.role };
      sessionStorage.setItem('session', JSON.stringify({ token, me }));
      showPanel();
      if (data.bootstrap) toast('Signed in with the setup key — create user accounts below', 'success');
    } catch {
      toast('Cannot reach API', 'error');
    }
  }

  function showPanel() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('whoami').textContent = `${me.username} (${me.role})`;
    document.getElementById('logout-link').style.display = 'inline';
    document.getElementById('users-card').style.display = me.role === 'admin' ? 'block' : 'none';
    loadLocations();
    if (me.role === 'admin') loadUsers();
  }

  function logout() {
    sessionStorage.removeItem('session');
    location.reload();
  }

  // Session expired / revoked: return to the login screen.
  function sessionExpired() {
    toast('Session expired — please sign in again', 'error');
    setTimeout(logout, 1200);
  }

  document.getElementById('admin-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  try {
    const saved = JSON.parse(sessionStorage.getItem('session') || 'null');
    if (saved && saved.token) { token = saved.token; me = saved.me; showPanel(); }
  } catch { /* ignore */ }

  // ── USER MANAGEMENT ────────────────────────────
  async function loadUsers() {
    const list = document.getElementById('user-list');
    try {
      const r = await fetch('/api/users', { headers: authHeaders() });
      if (r.status === 401) return sessionExpired();
      const users = await r.json();
      list.innerHTML = users.length === 0
        ? '<em style="color:#999">No users yet — add one below. Until then the setup key signs in as "admin".</em>'
        : users.map(u => `
          <div class="location-item">
            <div class="loc-info">
              <div class="loc-name">${escText(u.username)}</div>
              <div class="loc-meta">${escText(u.role)}</div>
            </div>
            <button class="btn btn-danger" data-user="${escText(u.username)}" onclick="deleteUser(this.dataset.user)">🗑</button>
          </div>`).join('');
    } catch {
      list.innerHTML = '<em style="color:#c00">Could not load users.</em>';
    }
  }

  async function saveUser() {
    const username = document.getElementById('u-name').value.trim();
    const password = document.getElementById('u-pass').value;
    const role = document.getElementById('u-role').value;
    if (!username) return toast('Username is required', 'error');
    try {
      const r = await fetch('/api/users', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ username, password: password || undefined, role })
      });
      if (r.status === 401) return sessionExpired();
      if (r.ok) {
        toast('User saved', 'success');
        document.getElementById('u-name').value = '';
        document.getElementById('u-pass').value = '';
        loadUsers();
      } else {
        const err = await r.json();
        toast(err.error || 'Failed to save user', 'error');
      }
    } catch { toast('Network error', 'error'); }
  }

  async function deleteUser(username) {
    if (!confirm(`Delete user "${username}"?`)) return;
    try {
      const r = await fetch('/api/users/' + encodeURIComponent(username), {
        method: 'DELETE', headers: authHeaders()
      });
      if (r.status === 401) return sessionExpired();
      if (r.ok) { toast('User deleted', 'success'); loadUsers(); }
      else toast((await r.json()).error || 'Failed to delete user', 'error');
    } catch { toast('Network error', 'error'); }
  }

  function escText(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ── GEOCODE (Nominatim) ────────────────────────
  async function geocode() {
    const q = document.getElementById('f-geocode').value.trim();
    if (!q) return;
    const res = document.getElementById('geocode-result');
    res.textContent = 'Searching…';
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, {
        headers: { 'Accept-Language': 'en' }
      });
      const data = await r.json();
      if (data.length === 0) { res.textContent = 'No results — try a different search term.'; return; }
      const { lat, lon, display_name } = data[0];
      document.getElementById('f-lat').value = parseFloat(lat).toFixed(4);
      document.getElementById('f-lng').value = parseFloat(lon).toFixed(4);
      res.textContent = '✅ ' + display_name;
    } catch {
      res.textContent = 'Geocode failed — enter coordinates manually.';
    }
  }

  document.getElementById('f-geocode').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); geocode(); }
  });

  // ── ADD LOCATION ───────────────────────────────
  async function addLocation() {
    const name = document.getElementById('f-name').value.trim();
    const country = document.getElementById('f-country').value.trim();
    const date = document.getElementById('f-date').value;
    const msg = document.getElementById('f-msg').value.trim();
    const lat = parseFloat(document.getElementById('f-lat').value);
    const lng = parseFloat(document.getElementById('f-lng').value);

    if (!name) return toast('Location name is required', 'error');
    if (!date) return toast('Date is required', 'error');
    if (isNaN(lat) || isNaN(lng)) return toast('Valid coordinates required — use the Search button', 'error');

    try {
      const r = await fetch('/api/locations', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ name, country, latitude: lat, longitude: lng, visitDate: date, message: msg })
      });

      if (r.status === 401) return sessionExpired();

      if (r.ok) {
        toast('Postcard added! 📮', 'success');
        clearForm();
        loadLocations();
      } else {
        const err = await r.json();
        toast(err.error || 'Failed to add', 'error');
      }
    } catch {
      toast('Network error', 'error');
    }
  }

  function clearForm() {
    ['f-name','f-country','f-date','f-msg','f-lat','f-lng','f-geocode'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('geocode-result').textContent = '';
  }

  // ── LOAD / RENDER LOCATIONS ────────────────────
  async function loadLocations() {
    const list = document.getElementById('location-list');
    try {
      const r = await fetch('/api/locations');
      const locs = await r.json();
      if (locs.length === 0) {
        list.innerHTML = '<em style="color:#999">No locations yet — add your first postcard above!</em>';
        return;
      }
      list.innerHTML = locs.map(loc => `
        <div class="location-item">
          <div class="loc-info">
            <div class="loc-name">📍 ${loc.name}${loc.country ? ', ' + loc.country : ''}</div>
            <div class="loc-meta">${formatDate(loc.visitDate)} · ${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}</div>
            ${loc.message ? `<div class="loc-msg">"${loc.message}"</div>` : ''}
          </div>
          ${me.role === 'admin' ? `<button class="btn btn-danger" onclick="deleteLocation('${loc.id}', '${escHtml(loc.name)}')">🗑</button>` : ''}
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<em style="color:#c00">Could not load locations.</em>';
    }
  }

  // ── DELETE LOCATION ────────────────────────────
  async function deleteLocation(id, name) {
    if (!confirm(`Remove "${name}" from the map?`)) return;
    try {
      const r = await fetch(`/api/locations/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (r.status === 401) return sessionExpired();
      if (r.ok) { toast('Location removed', 'success'); loadLocations(); }
      else toast('Failed to delete', 'error');
    } catch { toast('Network error', 'error'); }
  }

  // ── HELPERS ────────────────────────────────────
  function formatDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function escHtml(s) { return s.replace(/'/g, "\\'"); }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    setTimeout(() => el.className = '', 2800);
  }
</script>
</body>
</html>
