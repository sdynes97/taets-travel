<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>Admin — Taets Family Travels</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin.css"/>
</head>
<body>

<header>
  <h1>✉️ Taets Family — Admin</h1>
  <nav class="admin-nav">
    <a href="/admin" class="active">📮 Postcards</a>
    <a href="/admin/users" id="nav-users" style="display:none">👥 Users</a>
  </nav>
  <div>
    <span id="whoami" style="font-size:.85rem;margin-right:14px"></span>
    <a href="#" id="logout-link" style="display:none;margin-right:14px" onclick="logout();return false;">Sign out</a>
    <a href="/">← View Public Map</a>
  </div>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <h2>🔐 Admin Login</h2>
  <label for="login-user">Username</label>
  <input type="text" id="login-user" placeholder="Username" autocomplete="username"/>
  <label for="admin-key">Password</label>
  <input type="password" id="admin-key" placeholder="Password" autocomplete="current-password"/>
  <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
</div>

<!-- PANEL (hidden until login) -->
<div class="container" id="admin-panel" style="display:none">
  <!-- ADD POSTCARD FORM -->
  <div class="card">
    <h2 id="form-title">📮 Add a New Postcard</h2>

    <label>Location Name *</label>
    <input type="text" id="f-name" placeholder="e.g. Paris, Eiffel Tower, Lake Louise"/>

    <label>Date of Visit *</label>
    <input type="date" id="f-date"/>

    <label>Sent By</label>
    <input type="text" id="f-sentby" placeholder="e.g. Grandma Jo, The Taets Family" maxlength="100"/>

    <label>Postcard Message</label>
    <textarea id="f-msg" placeholder="What did the family write on the postcard?"></textarea>

    <label>Photos</label>
    <div class="photo-grid" id="existing-photos"></div>
    <input type="file" id="f-photos" accept="image/*" multiple/>
    <div style="font-size:.78rem;color:#888;margin-bottom:14px">Photos are resized in your browser before uploading (up to 20 per postcard).</div>

    <!-- Geocode helper -->
    <label>Find Coordinates (type location + click Search)</label>
    <div class="geocode-row">
      <input type="text" id="f-geocode" placeholder="e.g. Paris, France" style="margin-bottom:0"/>
      <button class="btn btn-secondary" onclick="geocode()">🔍 Search</button>
    </div>
    <div id="geocode-result" style="font-size:.78rem;color:#888;margin-bottom:14px;min-height:18px;"></div>

    <div class="coord-row">
      <div>
        <label>Latitude *</label>
        <input type="number" id="f-lat" step="0.0001" placeholder="e.g. 48.8566"/>
      </div>
      <div>
        <label>Longitude *</label>
        <input type="number" id="f-lng" step="0.0001" placeholder="e.g. 2.3522"/>
      </div>
    </div>

    <button class="btn btn-primary" id="save-btn" onclick="saveLocation()">📌 Add to Map</button>
    <button class="btn btn-secondary" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancel</button>
  </div>

  <!-- EXISTING LOCATIONS -->
  <div class="card">
    <h2>🗺️ All Locations</h2>
    <div id="location-list"><em style="color:#999">Loading…</em></div>
  </div>
</div>

<div id="toast"></div>

<script src="/admin-common.js"></script>
<script>
  // ── GEOCODE (Nominatim) ────────────────────────
  async function geocode() {
    const q = document.getElementById('f-geocode').value.trim();
    if (!q) return;
    const res = document.getElementById('geocode-result');
    res.textContent = 'Searching…';
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, {
        headers: { 'Accept-Language': 'en' }
      });
      const data = await r.json();
      if (data.length === 0) { res.textContent = 'No results — try a different search term.'; return; }
      const { lat, lon, display_name } = data[0];
      document.getElementById('f-lat').value = parseFloat(lat).toFixed(4);
      document.getElementById('f-lng').value = parseFloat(lon).toFixed(4);
      res.textContent = '✅ ' + display_name;
    } catch {
      res.textContent = 'Geocode failed — enter coordinates manually.';
    }
  }

  document.getElementById('f-geocode').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); geocode(); }
  });

  // ── ADD LOCATION ───────────────────────────────
  async function saveLocation() {
    const name = document.getElementById('f-name').value.trim();
    const date = document.getElementById('f-date').value;
    const msg = document.getElementById('f-msg').value.trim();
    const sentBy = document.getElementById('f-sentby').value.trim();
    const lat = parseFloat(document.getElementById('f-lat').value);
    const lng = parseFloat(document.getElementById('f-lng').value);
    const files = Array.from(document.getElementById('f-photos').files);

    if (!name) return toast('Location name is required', 'error');
    if (!date) return toast('Date is required', 'error');
    if (isNaN(lat) || isNaN(lng)) return toast('Valid coordinates required — use the Search button', 'error');

    try {
      const r = await fetch(editingId ? '/api/locations/' + encodeURIComponent(editingId) : '/api/locations', {
        method: editingId ? 'PUT' : 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ name, latitude: lat, longitude: lng, visitDate: date, message: msg, sentBy })
      });

      if (r.status === 401) return sessionExpired();

      if (r.ok) {
        const wasEditing = !!editingId;
        const locationId = editingId || (await r.json()).id;
        let failed = 0;
        for (let i = 0; i < files.length; i++) {
          toast(`Uploading photo ${i + 1} of ${files.length}…`, 'success');
          if (!await uploadPhoto(locationId, files[i])) failed++;
        }
        if (failed) toast(`Saved, but ${failed} photo${failed > 1 ? 's' : ''} failed to upload`, 'error');
        else toast(wasEditing ? 'Postcard updated ✏️' : 'Postcard added! 📮', 'success');
        cancelEdit();
        loadLocations();
      } else {
        const err = await r.json();
        toast(err.error || 'Failed to add', 'error');
      }
    } catch {
      toast('Network error', 'error');
    }
  }

  // ── PHOTOS ─────────────────────────────────────
  async function loadBitmap(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { /* fall through */ }
    }
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  // Scale so the longest side is at most maxDim, and re-encode as JPEG.
  async function resizeToJpeg(bitmap, maxDim, quality) {
    const w = bitmap.width, h = bitmap.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) =>
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('encode failed')), 'image/jpeg', quality));
  }

  async function uploadPhoto(locationId, file) {
    try {
      const bitmap = await loadBitmap(file);
      const form = new FormData();
      form.append('image', await resizeToJpeg(bitmap, 1800, 0.85), 'image.jpg');
      form.append('thumb', await resizeToJpeg(bitmap, 320, 0.8), 'thumb.jpg');
      const r = await fetch(`/api/locations/${encodeURIComponent(locationId)}/photos`, {
        method: 'POST', headers: authHeaders(), body: form
      });
      if (r.status === 401) { sessionExpired(); return false; }
      return r.ok;
    } catch {
      return false;
    }
  }

  function renderExistingPhotos(loc) {
    const grid = document.getElementById('existing-photos');
    grid.innerHTML = ((loc && loc.photos) || []).map(pid => `
      <div class="photo-thumb">
        <img src="/api/photos/${encodeURIComponent(loc.id)}/${encodeURIComponent(pid)}?size=thumb" alt="Photo" loading="lazy"/>
        <button type="button" title="Remove photo" data-loc="${escText(loc.id)}" data-photo="${escText(pid)}"
                onclick="deletePhoto(this.dataset.loc, this.dataset.photo)">✕</button>
      </div>`).join('');
  }

  async function deletePhoto(locationId, photoId) {
    if (!confirm('Remove this photo?')) return;
    try {
      const r = await fetch(`/api/locations/${encodeURIComponent(locationId)}/photos/${encodeURIComponent(photoId)}`, {
        method: 'DELETE', headers: authHeaders()
      });
      if (r.status === 401) return sessionExpired();
      if (!r.ok) return toast('Failed to remove photo', 'error');
      toast('Photo removed', 'success');
      await loadLocations();
      if (editingId === locationId) renderExistingPhotos(locationsById[locationId]);
    } catch { toast('Network error', 'error'); }
  }

  // ── EDIT LOCATION ──────────────────────────────
  let editingId = null;
  let locationsById = {};

  function editLocation(id) {
    const loc = locationsById[id];
    if (!loc) return;
    editingId = id;
    document.getElementById('f-name').value = loc.name;
    document.getElementById('f-date').value = loc.visitDate;
    document.getElementById('f-sentby').value = loc.sentBy || '';
    document.getElementById('f-msg').value = loc.message || '';
    document.getElementById('f-lat').value = loc.latitude;
    document.getElementById('f-lng').value = loc.longitude;
    document.getElementById('f-photos').value = '';
    renderExistingPhotos(loc);
    document.getElementById('f-geocode').value = '';
    document.getElementById('geocode-result').textContent = '';
    document.getElementById('form-title').textContent = '✏️ Edit Postcard';
    document.getElementById('save-btn').textContent = '💾 Save Changes';
    document.getElementById('cancel-btn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    clearForm();
    document.getElementById('form-title').textContent = '📮 Add a New Postcard';
    document.getElementById('save-btn').textContent = '📌 Add to Map';
    document.getElementById('cancel-btn').style.display = 'none';
  }

  function clearForm() {
    ['f-name','f-date','f-msg','f-sentby','f-lat','f-lng','f-geocode'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('geocode-result').textContent = '';
    document.getElementById('f-photos').value = '';
    document.getElementById('existing-photos').innerHTML = '';
  }

  // ── LOAD / RENDER LOCATIONS ────────────────────
  async function loadLocations() {
    const list = document.getElementById('location-list');
    try {
      const r = await fetch('/api/locations');
      const locs = await r.json();
      locationsById = Object.fromEntries(locs.map(l => [l.id, l]));
      if (locs.length === 0) {
        list.innerHTML = '<em style="color:#999">No locations yet — add your first postcard above!</em>';
        return;
      }
      list.innerHTML = locs.map(loc => `
        <div class="location-item">
          <div class="loc-info">
            <div class="loc-name">📍 ${escText(loc.name)}</div>
            <div class="loc-meta">${formatDate(loc.visitDate)}${loc.sentBy ? ' · from ' + escText(loc.sentBy) : ''} · ${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)}</div>
            ${loc.message ? `<div class="loc-msg">"${escText(loc.message)}"</div>` : ''}
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary" style="font-size:.85rem;padding:5px 12px" data-id="${escText(loc.id)}" onclick="editLocation(this.dataset.id)">✏️</button>
          ${me.role === 'admin' ? `<button class="btn btn-danger" onclick="deleteLocation('${loc.id}', '${escHtml(loc.name)}')">🗑</button>` : ''}
          </div>
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<em style="color:#c00">Could not load locations.</em>';
    }
  }

  // ── DELETE LOCATION ────────────────────────────
  async function deleteLocation(id, name) {
    if (!confirm(`Remove "${name}" from the map?`)) return;
    try {
      const r = await fetch(`/api/locations/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (r.status === 401) return sessionExpired();
      if (r.ok) { toast('Location removed', 'success'); if (editingId === id) cancelEdit(); loadLocations(); }
      else toast('Failed to delete', 'error');
    } catch { toast('Network error', 'error'); }
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function escHtml(s) { return s.replace(/'/g, "\\'"); }

  adminInit({ roles: ['admin', 'edit'], onReady: loadLocations });
</script>
</body>
</html>
