<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>Where in the World is the Taets Family?</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Merriweather', Georgia, serif;
      background: #f5f0e8;
      color: #3a2e1e;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ──────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #c8392b 0%, #922b21 100%);
      color: #fff;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0,0,0,.35);
      position: relative;
      z-index: 999;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stamp-icon {
      font-size: 2.4rem;
      line-height: 1;
    }

    header h1 {
      font-family: 'Caveat', cursive;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 1px 2px 4px rgba(0,0,0,.3);
    }

    header h1 span {
      font-size: 1.1rem;
      font-weight: 400;
      display: block;
      opacity: .85;
      font-family: 'Merriweather', serif;
      letter-spacing: .5px;
    }

    .header-stats {
      text-align: right;
      font-size: .85rem;
      opacity: .9;
    }

    .header-links { display: flex; gap: 14px; justify-content: flex-end; margin-top: 6px; }

    .admin-link {
      color: #ffc;
      font-size: .78rem;
      text-decoration: none;
      opacity: .85;
    }

    .admin-link:hover { text-decoration: underline; opacity: 1; }

    .header-stats strong {
      font-size: 1.6rem;
      font-family: 'Caveat', cursive;
      display: block;
      line-height: 1;
    }

    /* ── LAYOUT ──────────────────────────────────── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── MAP ─────────────────────────────────────── */
    #map {
      flex: 1;
      height: 100%;
    }

    /* ── SIDEBAR ─────────────────────────────────── */
    .sidebar {
      width: 330px;
      background: #fdf8ef;
      border-left: 3px solid #c8392b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      background: #c8392b;
      color: #fff;
      padding: 12px 16px;
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .postcard-entry {
      border-bottom: 1px dashed #d4c5a0;
      padding: 14px 16px;
      cursor: pointer;
      transition: background .15s;
    }

    .postcard-entry:hover { background: #f0e9d8; }

    .postcard-entry.active { background: #fdecea; border-left: 4px solid #c8392b; }

    .entry-location {
      font-size: .95rem;
      font-weight: 700;
      color: #922b21;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .entry-date {
      font-size: .75rem;
      color: #888;
      margin-top: 2px;
      font-style: italic;
    }

    .entry-msg {
      font-size: .82rem;
      margin-top: 6px;
      color: #4a3e2e;
      line-height: 1.45;
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
    }

    .postcard-stamp {
      float: right;
      background: #c8392b;
      color: #fff;
      font-size: .62rem;
      padding: 4px 6px;
      border-radius: 2px;
      text-align: center;
      min-width: 44px;
      border: 1px solid #a93226;
      font-family: 'Caveat', cursive;
      font-size: .8rem;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #9e8f75;
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    /* ── LEAFLET POPUP ───────────────────────────── */
    .postcard-popup {
      min-width: 220px;
      max-width: 280px;
      font-family: 'Merriweather', serif;
    }

    .popup-header {
      background: #c8392b;
      color: #fff;
      padding: 8px 12px;
      margin: -12px -12px 10px;
      font-size: .9rem;
      font-weight: 700;
      border-radius: 4px 4px 0 0;
    }

    .popup-date {
      font-size: .72rem;
      color: #888;
      font-style: italic;
      margin-bottom: 8px;
    }

    .popup-from {
      font-size: .8rem;
      color: #922b21;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-msg {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: #3a2e1e;
      line-height: 1.5;
      border-top: 1px dashed #ccc;
      padding-top: 8px;
    }

    /* ── PHOTOS IN POPUPS ────────────────────────── */
    .photo-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      padding: 8px 0 6px;
      margin-top: 8px;
      border-top: 1px dashed #ccc;
      -webkit-overflow-scrolling: touch;
    }

    .photo-strip img {
      flex: 0 0 auto;
      width: 78px;
      height: 78px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      cursor: zoom-in;
      scroll-snap-align: start;
      background: #eee;
    }

    .popup-actions { margin-top: 8px; }

    /* Camera badge on map pins and sidebar entries that have photos */
    .pin-badge {
      position: absolute;
      top: -8px;
      right: -12px;
      min-width: 20px;
      height: 20px;
      padding: 0 3px;
      border-radius: 10px;
      background: #fff;
      border: 1.5px solid #c8392b;
      font-size: .7rem;
      line-height: 17px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
      pointer-events: none;
    }

    .photo-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 8px;
      border-radius: 10px;
      background: #fdecea;
      border: 1px solid #e6b8b2;
      color: #922b21;
      font-style: normal;
      font-size: .72rem;
      white-space: nowrap;
    }

    .link-btn {
      background: none;
      border: none;
      color: #c8392b;
      font-family: 'Merriweather', serif;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .link-btn:hover { text-decoration: underline; }

    .entry-comments { margin-top: 6px; }

    /* ── MODALS ──────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(30,20,10,.55);
      display: none;
      align-items: center; justify-content: center;
      z-index: 10000;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }
    #auth-modal { z-index: 10010; }

    .modal {
      background: #fffdf8;
      border: 2px solid #c8392b;
      border-radius: 8px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    .modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #c8392b; color: #fff;
      padding: 10px 16px;
      font-family: 'Caveat', cursive; font-size: 1.4rem;
      border-radius: 5px 5px 0 0;
    }

    .modal-close {
      background: none; border: none; color: #fff;
      font-size: 1.3rem; cursor: pointer; line-height: 1;
    }

    .modal-body { padding: 16px; overflow-y: auto; }

    .modal label {
      display: block; font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 4px; color: #5a4530;
    }

    .modal input, .modal textarea {
      width: 100%; padding: 9px 12px; margin-bottom: 12px;
      border: 1.5px solid #c8b89a; border-radius: 5px;
      font-family: 'Merriweather', serif; font-size: 16px;
      background: #fff; color: #3a2e1e;
    }

    .modal textarea { min-height: 80px; resize: vertical; }

    .modal input:focus, .modal textarea:focus { outline: none; border-color: #c8392b; }

    .btn {
      display: inline-block; padding: 8px 20px; border: none; border-radius: 5px;
      background: #c8392b; color: #fff; cursor: pointer;
      font-family: 'Caveat', cursive; font-size: 1.2rem;
    }

    .btn:hover { background: #a93226; }
    .btn:disabled { opacity: .6; cursor: default; }

    .auth-note { margin-top: 14px; font-size: .78rem; color: #888; font-style: italic; }


    .form-msg { min-height: 20px; margin-bottom: 8px; font-size: .82rem; color: #c0392b; }
    .form-msg.ok { color: #27ae60; }

    /* ── COMMENTS ────────────────────────────────── */
    .comment { padding: 10px 0; border-bottom: 1px dashed #d4c5a0; }
    .comment:last-child { border-bottom: none; }
    .comment-meta { font-size: .75rem; color: #888; display: flex; gap: 8px; align-items: center; }
    .comment-author { font-weight: 700; color: #922b21; }
    .comment-text {
      margin-top: 4px; white-space: pre-wrap; word-break: break-word;
      font-family: 'Caveat', cursive; font-size: 1.35rem; line-height: 1.35;
    }
    .comment-empty { color: #9e8f75; font-family: 'Caveat', cursive; font-size: 1.2rem; padding: 6px 0 12px; }
    .comment-form { border-top: 2px solid #e0d0b5; margin-top: 12px; padding-top: 12px; }

    /* ── LIGHTBOX ────────────────────────────────── */
    #lightbox {
      position: fixed; inset: 0; z-index: 10020;
      background: rgba(0,0,0,.92);
      display: none; align-items: center; justify-content: center;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 94vw; max-height: 88vh; object-fit: contain;
      border-radius: 3px; box-shadow: 0 4px 30px rgba(0,0,0,.6);
    }

    .lb-btn {
      position: absolute; background: rgba(255,255,255,.15); color: #fff;
      border: none; border-radius: 50%; width: 44px; height: 44px;
      font-size: 1.5rem; cursor: pointer; line-height: 1;
    }

    .lb-btn:hover { background: rgba(255,255,255,.3); }
    #lb-close { top: 14px; right: 14px; }
    #lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
    #lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
    #lb-count { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ddd; font-size: .85rem; }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 6px; color: #fff;
      font-family: 'Caveat', cursive; font-size: 1.2rem;
      opacity: 0; transition: opacity .3s; z-index: 10030; pointer-events: none;
    }

    #toast.show { opacity: 1; }
    #toast.success { background: #27ae60; }
    #toast.error { background: #c0392b; }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 700px) {
      header { padding: 10px 14px; }
      .stamp-icon { font-size: 1.6rem; }
      .header-title { gap: 8px; }
      header h1 { font-size: 1.3rem; }
      header h1 span { font-size: .75rem; }
      .header-stats { font-size: .7rem; flex-shrink: 0; margin-left: 10px; }
      .header-stats strong { font-size: 1.3rem; }

      /* Map on top, postcards list scrolls underneath */
      .main { flex-direction: column; }
      #map { flex: 0 0 45%; height: 45%; }
      .sidebar {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-left: none;
        border-top: 3px solid #c8392b;
      }
    }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(245,240,232,.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #c8392b;
      flex-direction: column;
      gap: 14px;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e8d5c0;
      border-top-color: #c8392b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  Loading postcards…
</div>

<header>
  <div class="header-title">
    <div class="stamp-icon">✉️</div>
    <h1>
      Where in the World is the Taets Family?
      <span>Tracking adventures one postcard at a time</span>
    </h1>
  </div>
  <div class="header-stats">
    <strong id="stat-count">—</strong>
    places visited
    <div class="header-links">
      <a class="admin-link" href="/admin">🔐 Admin</a>
      <a class="admin-link" href="#" id="auth-link" onclick="authLinkClick(); return false;">Sign in</a>
    </div>
  </div>
</header>

<div class="main">
  <div id="map"></div>

  <aside class="sidebar">
    <div class="sidebar-header">📮 Postcards Received</div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="empty-state">Loading postcards…</div>
    </div>
  </aside>
</div>

<!-- SIGN IN / SIGN UP -->
<div class="modal-backdrop" id="auth-modal" onclick="if (event.target === this) closeAuth()">
  <div class="modal">
    <div class="modal-head"><span>🔐 Sign in to comment</span><button class="modal-close" onclick="closeAuth()" aria-label="Close">✕</button></div>
    <div class="modal-body">
      <label for="auth-user">Username</label>
      <input type="text" id="auth-user" autocomplete="username" autocapitalize="none"/>
      <label for="auth-pass">Password</label>
      <input type="password" id="auth-pass" autocomplete="current-password"/>
      <div class="form-msg" id="auth-msg"></div>
      <button class="btn" id="auth-submit" onclick="submitAuth()">Sign in</button>
      <p class="auth-note">Accounts are created by the site admin. Ask the family if you'd like to join in.</p>
    </div>
  </div>
</div>

<!-- COMMENTS -->
<div class="modal-backdrop" id="comments-modal" onclick="if (event.target === this) closeComments()">
  <div class="modal">
    <div class="modal-head"><span id="comments-title">💬 Comments</span><button class="modal-close" onclick="closeComments()" aria-label="Close">✕</button></div>
    <div class="modal-body">
      <div id="comments-list"></div>
      <div class="comment-form" id="comment-form"></div>
    </div>
  </div>
</div>

<!-- PHOTO LIGHTBOX -->
<div id="lightbox" onclick="if (event.target === this) closeLightbox()">
  <button class="lb-btn" id="lb-close" onclick="closeLightbox()" aria-label="Close">✕</button>
  <button class="lb-btn" id="lb-prev" onclick="lightboxStep(-1)" aria-label="Previous">‹</button>
  <img id="lb-img" alt="Postcard photo"/>
  <button class="lb-btn" id="lb-next" onclick="lightboxStep(1)" aria-label="Next">›</button>
  <div id="lb-count"></div>
</div>

<div id="toast"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ── MAP SETUP ──────────────────────────────────
  const map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    minZoom: 1
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
    maxZoom: 18
  }).addTo(map);

  // Custom postcard-red marker
  function makeIcon(color = '#c8392b', photoCount = 0) {
    return L.divIcon({
      className: '',
      html: `${photoCount ? `<span class="pin-badge" title="${photoCount} photo${photoCount > 1 ? 's' : ''}">📷</span>` : ''}<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
        <path d="M14 0 C6.27 0 0 6.27 0 14 C0 24.5 14 36 14 36 C14 36 28 24.5 28 14 C28 6.27 21.73 0 14 0Z"
              fill="${color}" stroke="#fff" stroke-width="2"/>
        <circle cx="14" cy="14" r="6" fill="#fff"/>
      </svg>`,
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -36]
    });
  }

  const markers = {};
  let allLocations = [];

  // ── LOAD LOCATIONS ─────────────────────────────
  async function loadLocations() {
    try {
      const res = await fetch('/api/locations');
      if (!res.ok) throw new Error('API error');
      allLocations = await res.json();
      renderMap(allLocations);
      renderSidebar(allLocations);
    } catch (e) {
      document.getElementById('sidebar-list').innerHTML =
        `<div class="empty-state">Could not load postcards.<br>Check your API connection.</div>`;
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function renderMap(locations) {
    document.getElementById('stat-count').textContent = locations.length;

    locations.forEach((loc, i) => {
      const marker = L.marker([loc.latitude, loc.longitude], { icon: makeIcon('#c8392b', (loc.photos || []).length) })
        .addTo(map)
        .bindPopup(`
          <div class="postcard-popup">
            <div class="popup-header">📍 ${escHtml(loc.name)}</div>
            <div class="popup-date">${formatDate(loc.visitDate)}${photoBadge(loc)}</div>
            ${loc.sentBy ? `<div class="popup-from">From: ${escHtml(loc.sentBy)}</div>` : ''}
            ${loc.message ? `<div class="popup-msg">"${escHtml(loc.message)}"</div>` : ''}
            ${photoStrip(loc)}
            <div class="popup-actions"><button class="link-btn" onclick="openComments('${loc.id}')">💬 Comments</button></div>
          </div>
        `, { maxWidth: 300 });

      marker.on('click', () => highlightEntry(loc.id));
      markers[loc.id] = marker;
    });

    if (locations.length > 0) {
      const group = L.featureGroup(Object.values(markers));
      map.fitBounds(group.getBounds().pad(0.15));
    }
  }

  function renderSidebar(locations) {
    const list = document.getElementById('sidebar-list');
    if (locations.length === 0) {
      list.innerHTML = `<div class="empty-state">No postcards yet!<br>Send the family on an adventure… 🌍</div>`;
      return;
    }

    list.innerHTML = locations.map(loc => `
      <div class="postcard-entry" id="entry-${loc.id}" onclick="flyTo('${loc.id}')">
        <div class="postcard-stamp">${formatYear(loc.visitDate)}</div>
        <div class="entry-location">📍 ${escHtml(loc.name)}</div>
        <div class="entry-date">${formatDate(loc.visitDate)}${loc.sentBy ? ' · from ' + escHtml(loc.sentBy) : ''}${photoBadge(loc)}</div>
        ${loc.message ? `<div class="entry-msg">"${escHtml(loc.message)}"</div>` : ''}
        <div class="entry-comments"><button class="link-btn" onclick="event.stopPropagation(); openComments('${loc.id}')">💬 Comments</button></div>
      </div>
    `).join('');
  }

  function flyTo(id) {
    const loc = allLocations.find(l => l.id === id);
    if (!loc) return;
    map.flyTo([loc.latitude, loc.longitude], 6, { duration: 1.2 });
    setTimeout(() => markers[id]?.openPopup(), 1200);
    highlightEntry(id);
  }

  function highlightEntry(id) {
    document.querySelectorAll('.postcard-entry').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('entry-' + id);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function formatYear(d) {
    if (!d) return '';
    return d.substring(0, 4);
  }

  // ── SESSION (shared with the admin pages) ──────
  let session = null; // { token, me: { username, role } }

  try {
    const saved = JSON.parse(localStorage.getItem('session') || 'null');
    if (saved && saved.token && saved.me) session = saved;
  } catch { /* storage blocked */ }

  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem('session', JSON.stringify(s));
      else localStorage.removeItem('session');
    } catch { /* storage blocked */ }
    updateAuthUI();
  }

  const authHeaders = (extra = {}) => session ? { ...extra, 'x-auth-token': 'Bearer ' + session.token } : extra;

  function updateAuthUI() {
    document.getElementById('auth-link').textContent = session ? `Sign out (${session.me.username})` : 'Sign in';
  }

  function authLinkClick() {
    if (session) { saveSession(null); toast('Signed out'); if (commentsLocId) renderCommentForm(); }
    else openAuth();
  }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + type;
    setTimeout(() => el.className = '', 2800);
  }

  // ── SIGN IN ────────────────────────────────────
  function openAuth() {
    setAuthMsg('');
    document.getElementById('auth-modal').classList.add('open');
    document.getElementById('auth-user').focus();
  }

  function closeAuth() { document.getElementById('auth-modal').classList.remove('open'); }

  function setAuthMsg(text) {
    const el = document.getElementById('auth-msg');
    el.textContent = text;
    el.className = 'form-msg';
  }

  async function submitAuth() {
    const username = document.getElementById('auth-user').value.trim();
    const password = document.getElementById('auth-pass').value;
    if (!username || !password) return setAuthMsg('Enter a username and password');

    const btn = document.getElementById('auth-submit');
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        return setAuthMsg(r.status === 401 ? 'Invalid username or password' : (data.error || 'Something went wrong'));
      }
      saveSession({ token: data.token, me: { username: data.username, role: data.role } });
      document.getElementById('auth-pass').value = '';
      closeAuth();
      toast(`Welcome, ${data.username}!`);
      if (commentsLocId) renderCommentForm();
    } catch {
      setAuthMsg('Cannot reach the server');
    } finally {
      btn.disabled = false;
    }
  }

  ['auth-user', 'auth-pass'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));

  // The saved token expired or was revoked.
  function sessionExpired() {
    saveSession(null);
    toast('Please sign in again', 'error');
    openAuth();
  }

  // ── COMMENTS ───────────────────────────────────
  let commentsLocId = null;

  async function openComments(id) {
    const loc = allLocations.find(l => l.id === id);
    if (!loc) return;
    commentsLocId = id;
    document.getElementById('comments-title').textContent = '💬 ' + loc.name;
    document.getElementById('comments-list').innerHTML = '<div class="comment-empty">Loading…</div>';
    document.getElementById('comments-modal').classList.add('open');
    renderCommentForm();
    await loadComments();
  }

  function closeComments() {
    document.getElementById('comments-modal').classList.remove('open');
    commentsLocId = null;
  }

  async function loadComments() {
    const id = commentsLocId;
    const list = document.getElementById('comments-list');
    try {
      const r = await fetch(`/api/locations/${encodeURIComponent(id)}/comments`);
      if (!r.ok) throw new Error();
      const comments = await r.json();
      if (id !== commentsLocId) return;
      list.innerHTML = comments.length === 0
        ? '<div class="comment-empty">No comments yet — be the first!</div>'
        : comments.map(c => {
            const canDelete = session && (session.me.role === 'admin' || session.me.username === c.author);
            return `<div class="comment">
              <div class="comment-meta">
                <span class="comment-author">${escHtml(c.author)}</span>
                <span>${escHtml(formatDateTime(c.createdAt))}</span>
                ${canDelete ? `<button class="link-btn" data-id="${escHtml(c.id)}" onclick="deleteComment(this.dataset.id)">Delete</button>` : ''}
              </div>
              <div class="comment-text">${escHtml(c.text)}</div>
            </div>`;
          }).join('');
    } catch {
      list.innerHTML = '<div class="comment-empty">Could not load comments.</div>';
    }
  }

  function renderCommentForm() {
    const el = document.getElementById('comment-form');
    if (!session) {
      el.innerHTML = '<button class="btn" onclick="openAuth()">Sign in to comment</button>';
      return;
    }
    el.innerHTML = `
      <label for="comment-text">Add a comment as ${escHtml(session.me.username)}</label>
      <textarea id="comment-text" maxlength="1000" placeholder="Share a memory or say hello…"></textarea>
      <button class="btn" id="comment-submit" onclick="postComment()">Post comment</button>`;
  }

  async function postComment() {
    const box = document.getElementById('comment-text');
    const text = box.value.trim();
    if (!text) return toast('Write something first', 'error');
    const btn = document.getElementById('comment-submit');
    btn.disabled = true;
    try {
      const r = await fetch(`/api/locations/${encodeURIComponent(commentsLocId)}/comments`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ text })
      });
      if (r.status === 401) return sessionExpired();
      if (!r.ok) return toast((await r.json().catch(() => ({}))).error || 'Could not post comment', 'error');
      box.value = '';
      await loadComments();
    } catch {
      toast('Network error', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteComment(commentId) {
    if (!confirm('Delete this comment?')) return;
    try {
      const r = await fetch(`/api/locations/${encodeURIComponent(commentsLocId)}/comments/${encodeURIComponent(commentId)}`, {
        method: 'DELETE', headers: authHeaders()
      });
      if (r.status === 401) return sessionExpired();
      if (!r.ok) return toast((await r.json().catch(() => ({}))).error || 'Could not delete comment', 'error');
      await loadComments();
    } catch {
      toast('Network error', 'error');
    }
  }

  function formatDateTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
  }

  // ── PHOTOS ─────────────────────────────────────
  const thumbUrl = (loc, pid) => `/api/photos/${encodeURIComponent(loc.id)}/${encodeURIComponent(pid)}?size=thumb`;
  const fullUrl = (loc, pid) => `/api/photos/${encodeURIComponent(loc.id)}/${encodeURIComponent(pid)}`;

  function photoBadge(loc) {
    const n = (loc.photos || []).length;
    return n ? `<span class="photo-badge">📷 ${n} photo${n > 1 ? 's' : ''}</span>` : '';
  }

  function photoStrip(loc) {
    if (!loc.photos || loc.photos.length === 0) return '';
    return `<div class="photo-strip">${loc.photos.map((pid, i) =>
      `<img src="${thumbUrl(loc, pid)}" alt="Photo ${i + 1}" loading="lazy" onclick="openLightbox('${loc.id}', ${i})"/>`
    ).join('')}</div>`;
  }

  let lbLoc = null;
  let lbIndex = 0;

  function openLightbox(locId, index) {
    lbLoc = allLocations.find(l => l.id === locId);
    if (!lbLoc || !lbLoc.photos.length) return;
    lbIndex = index;
    document.getElementById('lightbox').classList.add('open');
    showLightboxPhoto();
  }

  function showLightboxPhoto() {
    const photos = lbLoc.photos;
    document.getElementById('lb-img').src = fullUrl(lbLoc, photos[lbIndex]);
    document.getElementById('lb-count').textContent = `${lbIndex + 1} / ${photos.length}`;
    const multi = photos.length > 1;
    document.getElementById('lb-prev').style.display = multi ? '' : 'none';
    document.getElementById('lb-next').style.display = multi ? '' : 'none';
  }

  function lightboxStep(delta) {
    const n = lbLoc.photos.length;
    lbIndex = (lbIndex + delta + n) % n;
    showLightboxPhoto();
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lb-img').removeAttribute('src');
    lbLoc = null;
  }

  // Swipe left/right on the enlarged photo
  (function () {
    let startX = null;
    const box = document.getElementById('lightbox');
    box.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', e => {
      if (startX === null || !lbLoc || lbLoc.photos.length < 2) return;
      const dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) > 50) lightboxStep(dx < 0 ? 1 : -1);
    });
  })();

  document.addEventListener('keydown', e => {
    if (document.getElementById('lightbox').classList.contains('open')) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft' && lbLoc.photos.length > 1) lightboxStep(-1);
      else if (e.key === 'ArrowRight' && lbLoc.photos.length > 1) lightboxStep(1);
    } else if (e.key === 'Escape') {
      if (document.getElementById('auth-modal').classList.contains('open')) closeAuth();
      else if (document.getElementById('comments-modal').classList.contains('open')) closeComments();
    }
  });

  updateAuthUI();
  loadLocations();
</script>
</body>
</html>
